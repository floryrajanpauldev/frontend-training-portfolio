<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="description"
    content="HTML5 radio button and checkbox examples."
  >
  <title>Radio Buttons and Checkboxes</title>
</head>

<body>

  <main>
    <h1>Radio Buttons and Checkboxes</h1>

    <form action="#" method="post">

      <fieldset>
        <legend>Choose Your Favorite Drink</legend>

        <div>
          <input
            type="radio"
            id="coffee"
            name="drink"
            value="coffee"
          >
          <label for="coffee">Coffee</label>
        </div>

        <div>
          <input
            type="radio"
            id="tea"
            name="drink"
            value="tea"
          >
          <label for="tea">Tea</label>
        </div>

        <div>
          <input
            type="radio"
            id="cola"
            name="drink"
            value="cola"
          >
          <label for="cola">Cola</label>
        </div>

      </fieldset>

      <fieldset>
        <legend>Select Your Interests</legend>

        <div>
          <input
            type="checkbox"
            id="html"
            name="interests"
            value="html"
          >
          <label for="html">HTML</label>
        </div>

        <div>
          <input
            type="checkbox"
            id="css"
            name="interests"
            value="css"
          >
          <label for="css">CSS</label>
        </div>

        <div>
          <input
            type="checkbox"
            id="javascript"
            name="interests"
            value="javascript"
          >
          <label for="javascript">JavaScript</label>
        </div>

      </fieldset>

      <button type="submit">Submit</button>

    </form>

  </main>

</body>
</html>
