<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="description"
    content="Basic accessible HTML form example."
  >
  <title>Basic HTML Form</title>
</head>

<body>

  <main>
    <h1>Customer Information</h1>

    <form action="#" method="post">

      <div>
        <label for="full-name">Full Name</label>
        <input
          type="text"
          id="full-name"
          name="fullName"
        >
      </div>

      <div>
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
        >
      </div>

      <div>
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
        >
      </div>

      <button type="submit">Submit</button>

    </form>

  </main>

</body>
</html>
