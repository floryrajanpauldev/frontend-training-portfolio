<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="description"
    content="HTML form validation examples."
  >
  <title>Form Validation</title>
</head>

<body>

  <main>
    <h1>HTML Form Validation</h1>

    <form action="#" method="post">

      <div>
        <label for="full-name">Full Name</label>
        <input
          type="text"
          id="full-name"
          name="fullName"
          required
          minlength="2"
          maxlength="50"
        >
      </div>

      <br>

      <div>
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          required
        >
      </div>

      <br>

      <div>
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          minlength="8"
          maxlength="20"
        >
      </div>

      <br>

      <div>
        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          maxlength="15"
        >
      </div>

      <br>

      <div>
        <label for="comments">Comments</label>
        <textarea
          id="comments"
          name="comments"
          rows="5"
          cols="40"
          minlength="10"
          maxlength="250"
          required
        ></textarea>
      </div>

      <br>

      <div>
        <label for="account-number">Account Number</label>
        <input
          type="text"
          id="account-number"
          name="accountNumber"
          value="123456789"
          readonly
        >
      </div>

      <br>

      <button type="submit">Submit</button>
      <button type="reset">Reset</button>

    </form>

  </main>

</body>
</html>
