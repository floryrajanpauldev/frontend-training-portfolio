<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="description"
    content="HTML5 image examples demonstrating informative and decorative images."
  >
  <title>HTML5 Images</title>
</head>

<body>

  <main>
    <h1>HTML5 Images</h1>

    <section>
      <h2>Informative Image</h2>

      <img
        src="logo.png"
        alt="Example company logo"
        width="200"
        height="80"
      >

      <p>
        This image provides meaningful information, so the image has
        descriptive alternative text.
      </p>
    </section>

    <section>
      <h2>Decorative Image</h2>

      <img
        src="decorative-shape.png"
        alt=""
        width="300"
        height="100"
      >

      <p>
        This image is decorative and does not add meaningful information
        to the content.
      </p>
    </section>

  </main>

</body>
</html>
