<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="description"
    content="HTML superscript and subscript examples."
  >
  <title>Superscript and Subscript</title>
</head>

<body>

  <main>
    <h1>Superscript and Subscript</h1>

    <section>
      <h2>Superscript</h2>

      <p>
        The second power of x can be written as x<sup>2</sup>.
      </p>

      <p>
        This is the 1<sup>st</sup> example.
      </p>

      <p>
        A registered trademark can be displayed as Company<sup>®</sup>.
      </p>
    </section>

    <section>
      <h2>Subscript</h2>

      <p>
        Water is represented as H<sub>2</sub>O.
      </p>

      <p>
        Carbon dioxide is represented as CO<sub>2</sub>.
      </p>
    </section>

    <section>
      <h2>Combining Superscript and Subscript</h2>

      <p>
        Example: X<sub>1</sub><sup>2</sup>
      </p>
    </section>

  </main>

</body>
</html>
