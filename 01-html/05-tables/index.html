<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="description"
    content="HTML5 table example demonstrating accessible table structure."
  >
  <title>HTML5 Accessible Table</title>
</head>

<body>

  <main>
    <h1>Payment History</h1>

    <table>
      <caption>Recent Payment History</caption>

      <thead>
        <tr>
          <th scope="col">Payment Date</th>
          <th scope="col">Payment Source</th>
          <th scope="col">Amount</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>August 15, 2026</td>
          <td>Checking Account</td>
          <td>$250.00</td>
        </tr>

        <tr>
          <td>August 22, 2026</td>
          <td>Credit Card</td>
          <td>$175.00</td>
        </tr>

        <tr>
          <td>August 29, 2026</td>
          <td>Checking Account</td>
          <td>$325.00</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <th scope="row">Total</th>
          <td></td>
          <td>$750.00</td>
        </tr>
      </tfoot>
    </table>

  </main>

</body>
</html>
