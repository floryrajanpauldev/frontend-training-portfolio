<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Example of semantic HTML5 elements.">
  <title>Semantic HTML5 Example</title>
</head>

<body>

  <header>
    <div>
      <img src="logo.png" alt="Discover">
    </div>

    <nav aria-label="Main navigation">
      <ul>
        <li><a href="#accounts">Accounts</a></li>
        <li><a href="#payments">Payments</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Customer Banking Portal</h1>

    <section id="accounts">
      <h2>My Accounts</h2>
      <p>View your checking and savings accounts.</p>
    </section>

    <section id="payments">
      <h2>Recent Payments</h2>
      <p>Review your recent payment activity.</p>
    </section>
  </main>

  <footer>
    <nav aria-label="Footer navigation">
      <ul>
        <li><a href="#accounts">Accounts</a></li>
        <li><a href="#payments">Payments</a></li>
      </ul>
    </nav>

    <p>&copy; 2026 Example Banking Portal</p>
  </footer>

</body>
</html>
