<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="description"
    content="HTML address element example."
  >
  <title>HTML Address Element</title>
</head>

<body>

  <main>
    <h1>Address Element</h1>

    <section>
      <h2>Confirmation</h2>

      <p>Your information has been received.</p>

      <address>
        Tina Smith<br>
        123 Main Street<br>
        Dayton, OH 45402
      </address>
    </section>

    <section>
      <h2>Contact Information</h2>

      <address>
        Contact us at
        <a href="mailto:info@example.com">info@example.com</a><br>
        Call us at
        <a href="tel:+15551234567">+1 (555) 123-4567</a>
      </address>
    </section>

  </main>

</body>
</html>
